name: Frontend core checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test -- --maxWorkers=1 tests/formulas tests/ui/formula-block-security.test.tsx
      - run: npm run build
